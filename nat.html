<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about - cline.pub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal {
            max-width: 800px;
            width: 100%;
            border: 2px solid #0f0;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .terminal-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0f0;
        }

        .terminal-content {
            font-size: 14px;
            line-height: 1.8;
        }

        .prompt {
            color: #0f0;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #0f0;
            animation: blink 1s infinite;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        a {
            color: #0f0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .nav {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #0f0;
        }

        p {
            margin-bottom: 15px;
        }

        .command {
            color: #0f0;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="prompt">alex@cline:~$</span> cat about.txt
        </div>
        <div class="terminal-content">
            <div class="command">> about</div>

            <p>Nat is a beauty. Cares too much. Wins at life admin.</p>
          
            <div class="nav">
                <span class="prompt">alex@cline:~$</span> <a href="alex.html">cd ~</a>
                <span class="prompt">nat@cline:~$</span> <a href="nat.html">cd ~</a>
            </div>
        </div>
    </div>
</body>
</html>
